<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TamilGuard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #000;
      color: #f4f4f5;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ─────────────────────────────────────────────────── */
    .header {
      padding: 16px 18px 14px;
      border-bottom: 1px solid #27272a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #09090b;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .brand-name {
      font-size: 15px;
      font-weight: 800;
      color: #f4f4f5;
      letter-spacing: -0.3px;
    }
    .brand-sub {
      font-size: 10px;
      color: #71717a;
      margin-top: 1px;
    }

    /* Master toggle */
    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toggle-label {
      font-size: 11px;
      color: #71717a;
    }
    .toggle {
      position: relative;
      width: 36px; height: 20px;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer;
      inset: 0; border-radius: 20px;
      background: #3f3f46;
      transition: .3s;
    }
    .slider:before {
      content: "";
      position: absolute;
      height: 14px; width: 14px;
      left: 3px; bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: .3s;
    }
    input:checked + .slider { background: #6366f1; }
    input:checked + .slider:before { transform: translateX(16px); }

    /* ── Stats Bar ───────────────────────────────────────────────── */
    .stats-bar {
      padding: 12px 18px;
      background: #09090b;
      border-bottom: 1px solid #27272a;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stat-badge {
      flex: 1;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 10px;
      padding: 8px 10px;
      text-align: center;
    }
    .stat-badge .num {
      font-size: 20px;
      font-weight: 800;
      color: #a5b4fc;
      line-height: 1;
    }
    .stat-badge .lbl {
      font-size: 9px;
      color: #52525b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 3px;
    }
    #status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #3f3f46;
      margin-left: auto;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    #status-dot.online { background: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,0.5); }
    #status-dot.offline { background: #ef4444; }
    #status-text {
      font-size: 10px;
      color: #52525b;
      white-space: nowrap;
    }

    /* ── Settings ────────────────────────────────────────────────── */
    .settings {
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-bottom: 1px solid #27272a;
    }
    .setting-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .setting-label {
      font-size: 11px;
      font-weight: 600;
      color: #a1a1aa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .setting-row select,
    .setting-row input[type="text"] {
      background: #18181b;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      color: #f4f4f5;
      font-size: 13px;
      padding: 7px 10px;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
    }
    .setting-row select:focus,
    .setting-row input[type="text"]:focus {
      border-color: #6366f1;
    }
    .setting-row input[type="range"] {
      width: 100%;
      accent-color: #6366f1;
    }
    .range-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #52525b;
    }

    /* ── Footer ──────────────────────────────────────────────────── */
    .footer {
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .footer a {
      font-size: 10px;
      color: #52525b;
      text-decoration: none;
    }
    .footer a:hover { color: #a5b4fc; }
    .save-btn {
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 7px 16px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .save-btn:hover { background: #4f46e5; }
    .saved-msg {
      font-size: 11px;
      color: #22c55e;
      opacity: 0;
      transition: opacity 0.3s;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="brand">
      <div class="brand-icon">🛡️</div>
      <div>
        <div class="brand-name">TamilGuard</div>
        <div class="brand-sub">Abusive Content Blur</div>
      </div>
    </div>
    <div class="toggle-wrap">
      <span class="toggle-label" id="toggle-label">ON</span>
      <label class="toggle">
        <input type="checkbox" id="enabled-toggle" checked />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <!-- Stats Bar -->
  <div class="stats-bar">
    <div class="stat-badge">
      <div class="num" id="blurred-count">0</div>
      <div class="lbl">Blurred Today</div>
    </div>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 6px;">
      <div id="status-dot"></div>
      <span id="status-text">Checking…</span>
    </div>
  </div>

  <!-- Settings -->
  <div class="settings">

    <div class="setting-row">
      <span class="setting-label">Action on Detection</span>
      <select id="action-select">
        <option value="blur">🌫️  Blur the content</option>
        <option value="hide">🙈  Hide entirely</option>
        <option value="replace">▓▓▓  Replace with blocks</option>
      </select>
    </div>

    <div class="setting-row">
      <span class="setting-label">Sensitivity Level</span>
      <select id="sensitivity-select">
        <option value="standard">Standard — Neural + Exact Lexicon</option>
        <option value="strict">Strict — Leetspeak + Fuzzy Match</option>
        <option value="maximum">Maximum — Zero Tolerance</option>
      </select>
    </div>

    <div class="setting-row">
      <span class="setting-label">Blur Strength</span>
      <input type="range" id="blur-slider" min="2" max="20" step="1" value="8" />
      <div class="range-labels"><span>Subtle</span><span>Heavy</span></div>
    </div>

    <div class="setting-row">
      <span class="setting-label">API Endpoint</span>
      <input type="text" id="api-input" placeholder="http://localhost:5000" />
    </div>

  </div>

  <!-- Footer -->
  <div class="footer">
    <span class="saved-msg" id="saved-msg">✓ Saved!</span>
    <button class="save-btn" id="save-btn">Save Settings</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
