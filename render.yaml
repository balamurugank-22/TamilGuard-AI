# render.yaml — Render.com Blueprint for one-click deployment
# Deploy: https://render.com/deploy?repo=<your-github-repo-url>

services:
  - type: web
    name: tamilguard-ai
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn serve:app"
    plan: starter        # $7/mo — 512MB RAM, suitable for PyTorch CPU
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: NODE_VERSION
        value: "20.0.0"
